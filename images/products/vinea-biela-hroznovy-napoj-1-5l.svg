<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vinea-biela-hroznovy-napoj-1-5l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
    <pattern id="pat-vinea-biela-hroznovy-napoj-1-5l" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#16A34A" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bg-vinea-biela-hroznovy-napoj-1-5l)" />
  <rect width="400" height="300" rx="16" fill="url(#pat-vinea-biela-hroznovy-napoj-1-5l)" />

  <!-- Category & Package Badges Top -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#123524" />
    <text x="40" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">VINEA</text>

    <rect x="90" y="0" width="70" height="26" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
    <text x="125" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#14532D" text-anchor="middle">1,5 l</text>
  </g>

  <!-- Product Illustration Art -->
  
      <g transform="translate(130, 60)">
        <ellipse cx="70" cy="180" rx="45" ry="14" fill="#000" opacity="0.08"/>
        <!-- Green bottle -->
        <path d="M50,45 L90,45 L98,170 L42,170 Z" fill="#15803D" stroke="#14532D" stroke-width="2.5"/>
        <rect x="62" y="15" width="16" height="30" fill="#15803D"/>
        <rect x="62" y="5" width="16" height="12" rx="2" fill="#FACC15"/>
        <!-- Vinea gold wrap label with grapes -->
        <rect x="44" y="95" width="52" height="45" fill="#FEF08A"/>
        <text x="70" y="118" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#15803D" text-anchor="middle">vinea</text>
        <text x="70" y="130" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="#B45309" text-anchor="middle">BIELA 1,5 l</text>
      </g>
    

  <!-- Bottom Brand Footnote -->
  <g transform="translate(20, 275)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#141815" opacity="0.85">Hroznový sýtený nápoj biely</text>
    <text x="360" y="0" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#16A34A" text-anchor="end">Price Tracker SK</text>
  </g>
</svg>