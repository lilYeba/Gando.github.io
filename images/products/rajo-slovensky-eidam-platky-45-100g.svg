<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rajo-slovensky-eidam-platky-45-100g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEFCE8" />
    </linearGradient>
    <pattern id="pat-rajo-slovensky-eidam-platky-45-100g" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CA8A04" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bg-rajo-slovensky-eidam-platky-45-100g)" />
  <rect width="400" height="300" rx="16" fill="url(#pat-rajo-slovensky-eidam-platky-45-100g)" />

  <!-- Category & Package Badges Top -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#123524" />
    <text x="40" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">RAJO</text>

    <rect x="90" y="0" width="70" height="26" rx="6" fill="#FEF08A" stroke="#CA8A04" stroke-width="1" />
    <text x="125" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#713F12" text-anchor="middle">100 g</text>
  </g>

  <!-- Product Illustration Art -->
  
      <g transform="translate(110, 80)">
        <ellipse cx="90" cy="140" rx="85" ry="16" fill="#000" opacity="0.08"/>
        <rect x="25" y="45" width="130" height="90" rx="8" fill="#FFFFFF" stroke="#CA8A04" stroke-width="2"/>
        <!-- Yellow cheese slices stack -->
        <rect x="35" y="60" width="110" height="65" rx="4" fill="#FACC15" stroke="#EAB308" stroke-width="1.5"/>
        <!-- Cheese holes -->
        <circle cx="55" cy="80" r="6" fill="#FEF08A"/>
        <circle cx="95" cy="75" r="8" fill="#FEF08A"/>
        <circle cx="125" cy="90" r="5" fill="#FEF08A"/>
        <circle cx="75" cy="105" r="7" fill="#FEF08A"/>
        <rect x="35" y="45" width="110" height="22" rx="4" fill="#2563EB"/>
        <text x="90" y="58" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle">RAJO EIDAM 45%</text>
      </g>
    

  <!-- Bottom Brand Footnote -->
  <g transform="translate(20, 275)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#141815" opacity="0.85">Eidam plátky 45 %</text>
    <text x="360" y="0" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#CA8A04" text-anchor="end">Price Tracker SK</text>
  </g>
</svg>