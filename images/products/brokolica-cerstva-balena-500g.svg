<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-brokolica-cerstva-balena-500g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
    <pattern id="pat-brokolica-cerstva-balena-500g" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#16A34A" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bg-brokolica-cerstva-balena-500g)" />
  <rect width="400" height="300" rx="16" fill="url(#pat-brokolica-cerstva-balena-500g)" />

  <!-- Category & Package Badges Top -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="83" height="26" rx="6" fill="#123524" />
    <text x="41.5" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">ČERSTVÁ</text>

    <rect x="93" y="0" width="70" height="26" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
    <text x="128" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#14532D" text-anchor="middle">500 g</text>
  </g>

  <!-- Product Illustration Art -->
  
      <g transform="translate(120, 70)">
        <ellipse cx="80" cy="155" rx="65" ry="15" fill="#000" opacity="0.08"/>
        <path d="M65,115 L95,115 L88,155 L72,155 Z" fill="#86EFAC" stroke="#15803D" stroke-width="2"/>
        <circle cx="80" cy="70" r="32" fill="#16A34A"/>
        <circle cx="55" cy="90" r="28" fill="#15803D"/>
        <circle cx="105" cy="90" r="28" fill="#15803D"/>
        <circle cx="70" cy="100" r="22" fill="#22C55E"/>
        <circle cx="92" cy="100" r="22" fill="#22C55E"/>
      </g>
    

  <!-- Bottom Brand Footnote -->
  <g transform="translate(20, 275)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#141815" opacity="0.85">Brokolica čerstvá balená</text>
    <text x="360" y="0" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#16A34A" text-anchor="end">Price Tracker SK</text>
