<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-paradajky-strapcove-cervene-500g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>
    <pattern id="pat-paradajky-strapcove-cervene-500g" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DC2626" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bg-paradajky-strapcove-cervene-500g)" />
  <rect width="400" height="300" rx="16" fill="url(#pat-paradajky-strapcove-cervene-500g)" />

  <!-- Category & Package Badges Top -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="92" height="26" rx="6" fill="#123524" />
    <text x="46" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">BABINDOL</text>

    <rect x="102" y="0" width="70" height="26" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" />
    <text x="137" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#991B1B" text-anchor="middle">500 g</text>
  </g>

  <!-- Product Illustration Art -->
  
      <g transform="translate(95, 75)">
        <ellipse cx="105" cy="145" rx="85" ry="16" fill="#000" opacity="0.08"/>
        <!-- Vine stem -->
        <path d="M25,85 Q100,60 185,90" stroke="#15803D" stroke-width="4" fill="none"/>
        <!-- 4 tomatoes on vine -->
        <circle cx="45" cy="105" r="22" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
        <circle cx="85" cy="100" r="24" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
        <circle cx="125" cy="102" r="23" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
        <circle cx="165" cy="108" r="20" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
        <!-- Calyx leaves -->
        <path d="M85,76 L80,70 L85,65 L90,70 Z" fill="#22C55E"/>
        <path d="M125,78 L120,72 L125,67 L130,72 Z" fill="#22C55E"/>
      </g>
    

  <!-- Bottom Brand Footnote -->
  <g transform="translate(20, 275)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#141815" opacity="0.85">Paradajky strapcové červené</text>
    <text x="360" y="0" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#DC2626" text-anchor="end">Price Tracker SK</text>
  </g>
</svg>