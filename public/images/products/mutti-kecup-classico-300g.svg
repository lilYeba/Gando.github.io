<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mutti-kecup-classico-300g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>
    <pattern id="pat-mutti-kecup-classico-300g" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DC2626" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bg-mutti-kecup-classico-300g)" />
  <rect width="400" height="300" rx="16" fill="url(#pat-mutti-kecup-classico-300g)" />

  <!-- Category & Package Badges Top -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#123524" />
    <text x="40" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">MUTTI</text>

    <rect x="90" y="0" width="70" height="26" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1" />
    <text x="125" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#7F1D1D" text-anchor="middle">300 g</text>
  </g>

  <!-- Product Illustration Art -->
  
      <g transform="translate(135, 65)">
        <ellipse cx="65" cy="165" rx="45" ry="14" fill="#000" opacity="0.08"/>
        <path d="M40,55 L90,55 L95,155 L35,155 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2.5"/>
        <rect x="52" y="20" width="26" height="35" rx="3" fill="#DC2626"/>
        <rect x="55" y="10" width="20" height="12" rx="2" fill="#FFFFFF"/>
        <rect x="42" y="80" width="46" height="42" fill="#FFFFFF"/>
        <text x="65" y="97" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#DC2626" text-anchor="middle">MUTTI</text>
        <text x="65" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="7" fill="#15803D" text-anchor="middle">PARMA</text>
      </g>
    

  <!-- Bottom Brand Footnote -->
  <g transform="translate(20, 275)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#141815" opacity="0.85">Mutti Kečup Classico</text>
    <text x="360" y="0" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#DC2626" text-anchor="end">Price Tracker SK</text>
  </g>
</svg>