    <text x="68.5" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">KORUNNÝ CUKOR</text>

    <rect x="147" y="0" width="70" height="26" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1" />
