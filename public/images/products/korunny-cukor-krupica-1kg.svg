      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <pattern id="pat-korunny-cukor-krupica-1kg" width="20" height="20" patternUnits="userSpaceOnUse">
