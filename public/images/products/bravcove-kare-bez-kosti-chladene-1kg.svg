      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>
    <pattern id="pat-bravcove-kare-bez-kosti-chladene-1kg" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DC2626" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bg-bravcove-kare-bez-kosti-chladene-1kg)" />
  <rect width="400" height="300" rx="16" fill="url(#pat-bravcove-kare-bez-kosti-chladene-1kg)" />

  <!-- Category & Package Badges Top -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="146" height="26" rx="6" fill="#123524" />
    <text x="73" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">MÄSIAROV VÝBER</text>

    <rect x="156" y="0" width="70" height="26" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1" />
    <text x="191" y="17" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#7F1D1D" text-anchor="middle">1 kg</text>
  </g>

  <!-- Product Illustration Art -->
  
      <g transform="translate(100, 80)">
        <ellipse cx="100" cy="140" rx="90" ry="18" fill="#000" opacity="0.08"/>
        <rect x="15" y="45" width="170" height="85" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/>
        <!-- Pork loin meat cutlet -->
        <path d="M30,90 C40,65 160,65 165,95 C160,120 40,120 30,90 Z" fill="#F87171" stroke="#B91C1C" stroke-width="2"/>
        <path d="M30,75 C70,68 120,70 165,80" stroke="#FFFFFF" stroke-width="5" opacity="0.7" fill="none"/>
        <rect x="25" y="52" width="65" height="28" rx="4" fill="#B91C1C"/>
        <text x="57" y="66" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">BRAVČOVÉ KARÉ</text>
        <text x="57" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="7" fill="#FECACA" text-anchor="middle">BEZ KOSTI 1kg</text>
      </g>
    

  <!-- Bottom Brand Footnote -->
